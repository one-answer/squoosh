<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="539" height="162" viewBox="0 0 539 162" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- 精灵图标 -->
  <g transform="translate(30, 20) scale(0.8)">
    <!-- 精灵身体 -->
    <path d="M100 40 C130 40, 150 70, 150 100 C150 140, 120 160, 80 160 C40 160, 10 140, 10 100 C10 70, 30 40, 60 40 Z" fill="#8BC34A" />
    
    <!-- 精灵翅膀 -->
    <path d="M70 60 C50 30, 20 40, 10 60 C30 50, 50 60, 70 60 Z" fill="#CDDC39" />
    <path d="M130 60 C150 30, 180 40, 190 60 C170 50, 150 60, 130 60 Z" fill="#CDDC39" />
    
    <!-- 精灵眼睛 -->
    <circle cx="70" cy="90" r="10" fill="white" />
    <circle cx="130" cy="90" r="10" fill="white" />
    <circle cx="70" cy="90" r="5" fill="black" />
    <circle cx="130" cy="90" r="5" fill="black" />
    
    <!-- 精灵嘴巴 -->
    <path d="M80 120 C90 130, 110 130, 120 120" stroke="black" stroke-width="3" fill="none" />
    
    <!-- 图片元素 -->
    <rect x="60" y="70" width="80" height="60" rx="5" fill="#FF5722" opacity="0.5" />
    <rect x="70" y="80" width="60" height="40" rx="3" fill="#FFC107" opacity="0.7" />
  </g>
  
  <!-- 文字：小图精灵 -->
  <g transform="translate(200, 90)">
    <text font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="#333333">
      <tspan x="0" y="0">小图精灵</tspan>
    </text>
  </g>
  
  <!-- 装饰元素 -->
  <circle cx="20" cy="20" r="10" fill="#FF5722" opacity="0.7" />
  <circle cx="520" cy="140" r="15" fill="#8BC34A" opacity="0.7" />
  <circle cx="480" cy="30" r="8" fill="#FFC107" opacity="0.7" />
</svg>
